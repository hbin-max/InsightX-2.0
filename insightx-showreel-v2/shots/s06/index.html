<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Shot 06 — 态势矩阵+智库导出与升华落版 (21.5-30s)</title>
<style>
  html, body { margin: 0; background: #FAF5E8; overflow: hidden; width: 100%; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { stageSize, setupCanvas } from './motion.js';
import { loadUIImages } from './comic-kit.js';
import { renderS06, S06_DUR } from './s06.js';

const { W, H } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), W, H);
const U = Math.min(W, H) / 1080;

window.DUR = S06_DUR;
window.READY = false;

const IMGS = await loadUIImages(['onboarding', 'model', 'roiHigh', 'podcast', 'matrix', 'vault']);

window.render = t => {
  ctx.save();
  renderS06(ctx, t, W, H, U, IMGS);
  ctx.restore();
};

window.render(0);
window.READY = true;
</script>
</body>
</html>
