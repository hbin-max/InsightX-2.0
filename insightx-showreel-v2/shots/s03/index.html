<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Shot 03 — Bento参数格与手势划卡分拣 (8.5-13s)</title>
<style>
  html, body { margin: 0; background: #FAF5E8; overflow: hidden; width: 100%; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { stageSize, setupCanvas } from './motion.js';
import { loadUIImages } from './comic-kit.js';
import { renderS03, S03_DUR } from './s03.js';

const { W, H } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), W, H);
const U = Math.min(W, H) / 1080;

window.DUR = S03_DUR;
window.READY = false;

const IMGS = await loadUIImages(['model', 'swipeLeft', 'swipeRight']);

window.render = t => {
  ctx.save();
  renderS03(ctx, t, W, H, U, IMGS);
  ctx.restore();
};

window.render(0);
window.READY = true;
</script>
</body>
</html>
